<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thumbnail Magic - AI思い出スタイリスト</title>
<link rel="icon" type="image/png" href="https://spc-jp.github.io/thumbnail-magic/favicon.png" />
<link rel="apple-touch-icon" href="https://spc-jp.github.io/thumbnail-magic/favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  @keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
  }
  .animate-blob { animation: blob 7s infinite; }
  .animation-delay-2000 { animation-delay: 2s; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
  .pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a5b4fc; }
  .preset-active { border-color: #6366f1 !important; background: #eef2ff !important; box-shadow: 0 0 0 1px #6366f1; }
  .ratio-active { border-color: #6366f1 !important; background: #eef2ff !important; color: #4338ca !important; box-shadow: 0 0 0 1px #6366f1; }
  .mode-active { background: #ffffff !important; color: #4f46e5 !important; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
</style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800">

  <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-2 text-indigo-600">
      <span class="text-2xl">🪄</span>
      <h1 class="text-xl font-bold tracking-tight">Thumbnail Magic</h1>
    </div>
    <div class="text-sm text-gray-500 hidden sm:block">AI思い出スタイリスト</div>
  </header>

  <main class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

      <!-- 左カラム：操作パネル -->
      <div class="space-y-6">

        <!-- モード切替 -->
        <div class="flex bg-gray-200 p-1 rounded-xl">
          <button id="modeImageBtn" class="flex-1 flex items-center justify-center gap-2 py-3 text-sm font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700 mode-active">
            <span>🖼️</span>写真から変換
          </button>
          <button id="modeTextBtn" class="flex-1 flex items-center justify-center gap-2 py-3 text-sm font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700">
            <span>🔤</span>テキストから生成
          </button>
        </div>

        <!-- 入力エリア（画像モード） -->
        <div id="imageInputCard" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
            <span class="text-indigo-500">🖼️</span>
            1. 写真を選ぶ
          </h2>
          <div id="dropArea" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:bg-gray-50 hover:border-indigo-400 transition-colors cursor-pointer">
            <div class="text-4xl mb-3">⬆️</div>
            <p class="text-sm font-medium text-gray-700">クリックまたはドラッグ＆ドロップ</p>
            <p class="text-xs text-gray-500 mt-1">JPEG / PNG / HEIC / WEBP（自動で圧縮します）</p>
          </div>
          <div id="previewArea" class="hidden relative rounded-xl overflow-hidden group">
            <img id="previewImg" src="" alt="Source" class="w-full h-48 object-cover" />
            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <button id="resetImageBtn" class="bg-white text-gray-800 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors">
                別の写真を選ぶ
              </button>
            </div>
          </div>
          <input type="file" id="fileInput" accept="image/*" class="hidden" />
        </div>

        <!-- 入力エリア（テキストモード） -->
        <div id="textInputCard" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
            <span class="text-indigo-500">🔤</span>
            1. テキスト情報を入力する
          </h2>
          <div class="space-y-4">
            <div>
              <label class="text-sm font-medium text-gray-700 block mb-1">アプリ名（タイトル）</label>
              <input type="text" id="appNameInput" placeholder="例: Thumbnail Magic" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm" />
            </div>
            <div>
              <label class="text-sm font-medium text-gray-700 block mb-1">キャッチコピー</label>
              <input type="text" id="catchCopyInput" placeholder="例: AIが思い出を特別な一枚に" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm" />
            </div>
            <div class="bg-blue-50 text-blue-800 p-3 rounded-lg text-xs flex gap-2 items-start border border-blue-100">
              <span class="shrink-0">✨</span>

            </div>
          </div>
        </div>

        <!-- スタイル選択 -->

            <textarea id="promptArea" placeholder="ボタンを押すか、作りたいイメージを入力してください..." class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none h-24 text-sm"></textarea>

          <button id="downloadBtn" class="flex items-center gap-2 bg-white text-gray-800 px-6 py-3 rounded-full font-medium shadow-sm hover:shadow-md hover:bg-gray-50 transition-all border border-gray-200 absolute bottom-8">
            <span>⬇️</span>画像を保存する

          <div class="text-6xl mb-4 opacity-50">🖼️</div>
          <p>ここに完成した画像が表示されます</p>

        <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-indigo-200 rounded-full mix-blend-multiply opacity-30 animate-blob animation-delay-2000 pointer-events-none"></div>
      </div>

    </div>

<script>
/* ============================================================
   Thumbnail Magic - vanilla JS版
   APIキーはフロントに置かず、Cloudflare Workers経由で呼ぶ前提
   ============================================================ */

// ▼ Cloudflare Workers のURLをここに設定してください ▼
const WORKER_URL = 'https://thumbnail-magic.YOUR-SUBDOMAIN.workers.dev';

// 状態
const state = {
  mode: 'image',          // 'image' or 'text'
  sourceImage: null,      // dataURL（圧縮後JPEG）
  appName: '',
  catchCopy: '',
  prompt: '',
  aspectRatio: 'original',
  isGenerating: false,
  resultImage: null,
  error: ''
};

const presets = [
  { id: 1,  title: '❶ アニメ映画風',   icon: '🌸', prompt: 'この写真をアニメ映画のワンシーンのようにイラスト化して。背景も自然豊かにして、美しい光の表現を入れてください。' },
  { id: 2,  title: '❷ 水彩画タッチ',   icon: '🎨', prompt: 'この写真を水彩画風に変換して。やさしいタッチで、背景はふんわりぼかして、温かみのある色合いにしてください。' },
  { id: 3,  title: '❸ 絵本の表紙風',   icon: '📖', prompt: 'この写真を使って、子ども向け絵本の表紙をデザインして。可愛いイラスト調にして、タイトル文字を入れるスペースを上部に空けてください。' },
  { id: 4,  title: '❹ レトロポスター', icon: '🎞️', prompt: 'この写真を1960年代の映画ポスター風に変換して。レトロな色使いで、少し色褪せたようなビンテージ加工を施してください。' },
  { id: 5,  title: '❺ グリーティング', icon: '☀️', prompt: 'この写真を使って、爽やかなイラスト調のグリーティングカードを作ってください。' },
  { id: 6,  title: '❻ アイコン用',     icon: '✨', prompt: 'この写真をSNSアイコン用にかわいくデフォルメしたイラストにして。丸く切り抜ける構図で、ポップで明るい雰囲気にしてください。' },
  { id: 7,  title: '❼ コラージュ風',   icon: '🖼️', prompt: 'この写真をベースに、パステルカラーのタッチで統一感のあるおしゃれなイラストに仕上げてください。' },
  { id: 8,  title: '❽ 家族似顔絵',     icon: '👨‍👩‍👧', prompt: 'この写真をもとに、あたたかい雰囲気の似顔絵イラストにして。少しコミカルで親しみやすいタッチにしてください。' },
  { id: 9,  title: '❾ ジブリ映画風',   icon: '🍃', prompt: 'この写真を、温かみのある手描きタッチのアニメイラストにして。豊かな自然や美しい青空、ノスタルジックな雰囲気を強調してください。' },
  { id: 10, title: '❿ 3Dアニメ風',     icon: '🧸', prompt: 'この写真を、海外の高品質な3Dアニメーション映画のようなCGキャラクターや世界観に変換して。立体的でカラフル、ポップな印象にしてください。' },
  { id: 11, title: '⓫ ドット絵風',     icon: '👾', prompt: 'この写真を、昔のスーパーファミコンのような16ビットのドット絵（ピクセルアート）に変換して。レトロゲームのような雰囲気にしてください。' },
  { id: 12, title: '⓬ シンプル線画',   icon: '✍️', prompt: 'この写真を、シンプルでおしゃれな線画（ラインアート）イラストにして。色は控えめなモノトーンやベージュ系にしてください。' }
];

const ratios = [
  { id: 'original', label: 'そのまま', icon: '🖼️' },
  { id: '1:1',      label: '1:1 (正方)', icon: '⬛' },
  { id: '16:9',     label: '16:9 (横長)', icon: '▭' },
  { id: '9:16',     label: '9:16 (縦長)', icon: '▯' }
];

/* ---------- DOM参照 ---------- */
const $ = (id) => document.getElementById(id);

const dom = {
  modeImageBtn: $('modeImageBtn'),
  modeTextBtn:  $('modeTextBtn'),
  imageInputCard: $('imageInputCard'),
  textInputCard:  $('textInputCard'),
  dropArea: $('dropArea'),
  previewArea: $('previewArea'),
  previewImg:  $('previewImg'),
  resetImageBtn: $('resetImageBtn'),
  fileInput: $('fileInput'),
  appNameInput: $('appNameInput'),
  catchCopyInput: $('catchCopyInput'),
  presetGrid: $('presetGrid'),
  promptArea: $('promptArea'),
  ratioGrid: $('ratioGrid'),
  generateBtn: $('generateBtn'),
  generateBtnLabel: $('generateBtnLabel'),
  errorBox: $('errorBox'),
  previewLoading: $('previewLoading'),
  previewLoadingText: $('previewLoadingText'),
  previewResult: $('previewResult'),
  resultImg: $('resultImg'),
  downloadBtn: $('downloadBtn'),
  previewEmpty: $('previewEmpty')
};

/* ---------- 初期化 ---------- */
function init() {
  renderPresets();
  renderRatios();
  bindEvents();
  updateUI();
}

/* ---------- プリセット描画 ---------- */
function renderPresets() {
  dom.presetGrid.innerHTML = presets.map(p => `
    <button data-preset-id="${p.id}" class="preset-btn text-left p-3 rounded-xl border border-gray-200 hover:border-indigo-300 hover:bg-gray-50 text-sm transition-all duration-200 flex flex-col justify-center min-h-[60px]">
      <div class="font-medium text-gray-800 leading-tight">${p.icon} ${p.title}</div>
    </button>
  `).join('');

  dom.presetGrid.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.presetId);
      const p = presets.find(x => x.id === id);
      if (!p) return;
      let newPrompt = p.prompt;
      if (state.mode === 'text') {
        newPrompt = newPrompt.replace(/この写真を?(使って|ベースに|もとに)?(、)?/g, '入力したテキスト情報をもとに、');
      }
      state.prompt = newPrompt;
      dom.promptArea.value = newPrompt;
      updatePresetActive();
      updateUI();
    });
  });
}

function updatePresetActive() {
  dom.presetGrid.querySelectorAll('.preset-btn').forEach(btn => {
    const id = Number(btn.dataset.presetId);
    const p = presets.find(x => x.id === id);
    if (p && p.prompt === state.prompt) {
      btn.classList.add('preset-active');
    } else {
      btn.classList.remove('preset-active');
    }
  });
}

/* ---------- アスペクト比描画 ---------- */
function renderRatios() {
  dom.ratioGrid.innerHTML = ratios.map(r => `
    <button data-ratio-id="${r.id}" class="ratio-btn p-3 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium transition-all flex flex-col items-center justify-center gap-2 hover:border-indigo-300 hover:bg-gray-50">
      <div class="h-6 flex items-center justify-center text-xl opacity-70">${r.icon}</div>
      ${r.label}
    </button>
  `).join('');

  dom.ratioGrid.querySelectorAll('.ratio-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.aspectRatio = btn.dataset.ratioId;
      updateRatioActive();
    });
  });
  updateRatioActive();
}

function updateRatioActive() {
  dom.ratioGrid.querySelectorAll('.ratio-btn').forEach(btn => {
    if (btn.dataset.ratioId === state.aspectRatio) {
      btn.classList.add('ratio-active');
    } else {
      btn.classList.remove('ratio-active');
    }
  });
}

/* ---------- イベントバインド ---------- */
function bindEvents() {
  // モード切替
  dom.modeImageBtn.addEventListener('click', () => switchMode('image'));
  dom.modeTextBtn.addEventListener('click',  () => switchMode('text'));

  // 画像アップロード
  dom.dropArea.addEventListener('click', () => dom.fileInput.click());
  dom.dropArea.addEventListener('dragover', (e) => e.preventDefault());
  dom.dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });
  dom.fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFile(file);
  });
  dom.resetImageBtn.addEventListener('click', () => {
    state.sourceImage = null;
    state.resultImage = null;
    dom.fileInput.value = '';
    updateUI();
  });

  // テキスト入力
  dom.appNameInput.addEventListener('input',   (e) => { state.appName = e.target.value; updateUI(); });
  dom.catchCopyInput.addEventListener('input', (e) => { state.catchCopy = e.target.value; updateUI(); });
  dom.promptArea.addEventListener('input',     (e) => { state.prompt = e.target.value; updatePresetActive(); updateUI(); });

  // 生成
  dom.generateBtn.addEventListener('click', generateImage);

  // ダウンロード
  dom.downloadBtn.addEventListener('click', handleDownload);
}

/* ---------- モード切替 ---------- */
function switchMode(mode) {
  state.mode = mode;
  if (mode === 'image') {
    dom.modeImageBtn.classList.add('mode-active');
    dom.modeTextBtn.classList.remove('mode-active');
    dom.imageInputCard.classList.remove('hidden');
    dom.textInputCard.classList.add('hidden');
  } else {
    dom.modeTextBtn.classList.add('mode-active');
    dom.modeImageBtn.classList.remove('mode-active');
    dom.textInputCard.classList.remove('hidden');
    dom.imageInputCard.classList.add('hidden');
  }
  updateUI();
}

/* ---------- 画像処理（Canvas圧縮 1280px JPEG） ---------- */
function handleFile(file) {
  // ※あえて file.size チェックはしない（HEIC等を弾かないため）
  if (!file.type.startsWith('image/') && !/\.(heic|heif)$/i.test(file.name)) {
    showError('画像ファイルを選択してください。');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      try {
        const compressed = compressToJpeg(img, 1280, 0.85);
        state.sourceImage = compressed;
        state.resultImage = null;
        clearError();
        updateUI();
      } catch (err) {
        console.error(err);
        showError('画像の読み込みに失敗しました。別の画像でお試しください。');
      }
    };
    img.onerror = () => showError('画像を読み込めませんでした（HEICはJPEGなどに変換してから再度お試しください）。');
    img.src = e.target.result;
  };
  reader.onerror = () => showError('ファイル読み込みに失敗しました。');
  reader.readAsDataURL(file);
}

function compressToJpeg(img, maxSize, quality) {
  let { width, height } = img;
  if (width > maxSize || height > maxSize) {
    if (width >= height) {
      height = Math.round(height * (maxSize / width));
      width = maxSize;
    } else {
      width = Math.round(width * (maxSize / height));
      height = maxSize;
    }
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}

/* ---------- 生成 ---------- */
async function generateImage() {
  if (state.isGenerating) return;

  if (state.mode === 'image' && !state.sourceImage) {
    showError('まずは元となる画像をアップロードしてください。');
    return;
  }
  if (state.mode === 'text' && !state.appName && !state.catchCopy) {
    showError('アプリ名かキャッチコピーのどちらかを入力してください。');
    return;
  }
  if (!state.prompt) {
    showError('プロンプト（変換の指示）を入力するか、プリセットを選択してください。');
    return;
  }

  state.isGenerating = true;
  state.resultImage = null;
  clearError();
  updateUI();

  try {
    const body = {
      mode: state.mode,
      prompt: state.prompt,
      aspectRatio: state.aspectRatio,
      appName: state.appName,
      catchCopy: state.catchCopy,
      sourceImage: state.mode === 'image' ? state.sourceImage : null
    };

    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error('生成APIエラー: ' + res.status + ' ' + t);
    }

    const data = await res.json();
    if (data.imageBase64 && data.mimeType) {
      state.resultImage = `data:${data.mimeType};base64,${data.imageBase64}`;
    } else if (data.error) {
      showError('AIが画像を生成できませんでした：' + data.error);
    } else {
      showError('AIが画像を生成できませんでした。プロンプトの内容を変更してお試しください。');
    }
  } catch (err) {
    console.error(err);
    showError('通信エラーが発生しました。しばらく待ってから再度お試しください。');
  } finally {
    state.isGenerating = false;
    updateUI();
  }
}

/* ---------- ダウンロード ---------- */
function handleDownload() {
  if (!state.resultImage) return;
  const a = document.createElement('a');
  a.href = state.resultImage;
  a.download = `thumbnail-magic-${Date.now()}.jpg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ---------- UI更新 ---------- */
function isReadyToGenerate() {
  if (state.mode === 'image') return !!state.sourceImage && !!state.prompt;
  if (state.mode === 'text')  return (state.appName || state.catchCopy) && !!state.prompt;
  return false;
}

function updateUI() {
  // プレビュー画像（左カラム）
  if (state.sourceImage) {
    dom.dropArea.classList.add('hidden');
    dom.previewArea.classList.remove('hidden');
    dom.previewImg.src = state.sourceImage;
  } else {
    dom.dropArea.classList.remove('hidden');
    dom.previewArea.classList.add('hidden');
    dom.previewImg.src = '';
  }

  // 生成ボタン
  const ready = isReadyToGenerate();
  if (state.isGenerating) {
    dom.generateBtn.disabled = true;
    dom.generateBtn.className = 'w-full py-4 rounded-xl font-bold text-white shadow-md flex items-center justify-center gap-2 transition-all bg-gray-400 cursor-not-allowed';
    dom.generateBtnLabel.textContent = '魔法をかけています...';
  } else if (!ready) {
    dom.generateBtn.disabled = true;
    dom.generateBtn.className = 'w-full py-4 rounded-xl font-bold text-white shadow-md flex items-center justify-center gap-2 transition-all bg-gray-400 cursor-not-allowed';
    dom.generateBtnLabel.textContent = 'この設定で生成する';
  } else {
    dom.generateBtn.disabled = false;
    dom.generateBtn.className = 'w-full py-4 rounded-xl font-bold text-white shadow-md flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 hover:shadow-lg active:scale-[0.98]';
    dom.generateBtnLabel.textContent = 'この設定で生成する';
  }

  // 右カラム
  dom.previewLoading.classList.add('hidden');
  dom.previewResult.classList.add('hidden');
  dom.previewEmpty.classList.add('hidden');
  dom.previewLoading.classList.remove('flex');
  dom.previewResult.classList.remove('flex');

  if (state.isGenerating) {
    dom.previewLoading.classList.remove('hidden');
    dom.previewLoading.classList.add('flex');
    dom.previewLoadingText.textContent = state.mode === 'image'
      ? 'AIがピクセルを描き出しています...'
      : 'AIがデザインを考えています...';
  } else if (state.resultImage) {
    dom.previewResult.classList.remove('hidden');
    dom.previewResult.classList.add('flex');
    dom.resultImg.src = state.resultImage;
  } else {
    dom.previewEmpty.classList.remove('hidden');
  }
}

/* ---------- エラー表示 ---------- */
function showError(msg) {
  state.error = msg;
  dom.errorBox.textContent = msg;
  dom.errorBox.classList.remove('hidden');
}
function clearError() {
  state.error = '';
  dom.errorBox.textContent = '';
  dom.errorBox.classList.add('hidden');
}

/* ---------- 起動 ---------- */
document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
