<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail Magic</title>
  <link rel="icon" href="https://spc-jp.github.io/thumbnail-magic/favicon.png" type="image/png">
  
  <!-- スタイルとReactの読み込み -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a5b4fc; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans selection:bg-indigo-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // --- アイコンコンポーネント ---
    const IconWand = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8L19 13"/><path d="M15 9h0"/><path d="M17.8 6.2L19 5"/><path d="M3 21l9-9"/><path d="M12.2 6.2L11 5"/></svg>;
    const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const IconImage = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
    const IconType = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>;
    const IconSparkles = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
    const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
    const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

    function App() {
      // =========================================================
      // 【重要】ここに作成したCloudflare WorkerのURLを入力してください
      // =========================================================
      const WORKER_URL = "https://thumbnail-magic.yymmatsu.workers.dev";
      
      const [mode, setMode] = useState('image');
      const [sourceImage, setSourceImage] = useState(null);
      const [appName, setAppName] = useState('');
      const [catchCopy, setCatchCopy] = useState('');
      const [prompt, setPrompt] = useState('');
      const [aspectRatio, setAspectRatio] = useState('original');
      const [isGenerating, setIsGenerating] = useState(false);
      const [resultImage, setResultImage] = useState(null);
      const [error, setError] = useState('');
      const fileInputRef = useRef(null);

      const presets = [
        { id: 1, title: 'アニメ映画風', icon: '🌸', prompt: 'この写真をアニメ映画のワンシーンのようにイラスト化して。背景も自然豊かにして、美しい光の表現を入れてください。' },
        { id: 2, title: '水彩画タッチ', icon: '🎨', prompt: 'この写真を水彩画風に変換して。やさしいタッチで、背景はふんわりぼかして、温かみのある色合いにしてください。' },
        { id: 3, title: '絵本の表紙風', icon: '📖', prompt: 'この写真を使って、子ども向け絵本の表紙をデザインして。可愛いイラスト調にして、タイトル文字を入れるスペースを上部に空けてください。' },
        { id: 4, title: 'レトロポスター', icon: '🎞️', prompt: 'この写真を1960年代の映画ポスター風に変換して。レトロな色使いで、少し色褪せたようなビンテージ加工を施してください。' },
        { id: 5, title: 'グリーティング', icon: '☀️', prompt: 'この写真を使って、爽やかなイラスト調のグリーティングカードを作ってください。' },
        { id: 6, title: 'アイコン用', icon: '✨', prompt: 'この写真をSNSアイコン用にかわいくデフォルメしたイラストにして。丸く切り抜ける構図で、ポップで明るい雰囲気にしてください。' },
        { id: 9, title: 'ジブリ映画風', icon: '🍃', prompt: 'この写真を、温かみのある手描きタッチのアニメイラストにして。豊かな自然や美しい青空、ノスタルジックな雰囲気を強調してください。' },
        { id: 10, title: '3Dアニメ風', icon: '🧸', prompt: 'この写真を、海外の高品質な3Dアニメーション映画のようなCGキャラクターや世界観に変換して。立体的でカラフル、ポップな印象にしてください。' }
      ];

      const ratios = [
        { id: 'original', label: 'そのまま' },
        { id: '1:1', label: '1:1 (正方)' },
        { id: '16:9', label: '16:9 (横長)' },
        { id: '9:16', label: '9:16 (縦長)' },
      ];

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          // エラーメッセージをリセット
          setError('');
          
          const reader = new FileReader();
          reader.onloadend = () => {
            // 画像を読み込んだ後、自動でリサイズ＆圧縮を行う
            const img = new window.Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              // APIの制限に合わせて最大2048pxにリサイズ
              const maxDimension = 2048; 

              if (width > maxDimension || height > maxDimension) {
                if (width > height) {
                  height = Math.round((height * maxDimension) / width);
                  width = maxDimension;
                } else {
                  width = Math.round((width * maxDimension) / height);
                  height = maxDimension;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              // 圧縮して軽量なJPEGにする（画質80%）
              const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
              
              setSourceImage(compressedDataUrl);
              setResultImage(null);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        }
      };

      const handlePresetClick = (p) => {
        if (mode === 'text') {
          const newPrompt = p.prompt.replace(/この写真を?(使って|ベースに|もとに)?(、)?/g, '入力したテキスト情報をもとに、');
          setPrompt(newPrompt);
        } else {
          setPrompt(p.prompt);
        }
      };

      const generateImage = async () => {
        if (WORKER_URL.includes("your-worker-name")) {
          setError('コード内の WORKER_URL が初期値のままです。ご自身のCloudflare WorkerのURLに変更してください。');
          return;
        }

        if (mode === 'image' && !sourceImage) return;
        if (mode === 'text' && !appName && !catchCopy) return;
        if (!prompt) return;

        setIsGenerating(true);
        setError('');
        setResultImage(null);

        try {
          let response;

          if (mode === 'image') {
            const base64Data = sourceImage.split(',')[1];
            const mimeType = sourceImage.split(';')[0].split(':')[1];
            let finalPrompt = prompt;
            if (aspectRatio !== 'original') {
              finalPrompt += `\n\n【重要】出力画像のアスペクト比（縦横比）は必ず「${aspectRatio}」で生成してください。`;
            }

            // Cloudflare Workerへ送信 (Image to Image)
            const url = `${WORKER_URL}/api/generate-image`;
            const payload = {
              contents: [{
                parts: [
                  { text: finalPrompt },
                  { inlineData: { mimeType: mimeType, data: base64Data } }
                ]
              }],
              generationConfig: { responseModalities: ["TEXT", "IMAGE"] }
            };

            response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            
            if (!response.ok) {
              const errData = await response.json();
              throw new Error(errData.error || '通信エラー');
            }

            const result = await response.json();
            const outputBase64 = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

            if (outputBase64) {
              setResultImage(`data:image/jpeg;base64,${outputBase64}`);
            } else {
              setError('AIが画像を生成できませんでした。');
            }

          } else {
            let textModePrompt = `以下は画像内に配置したいテキスト情報です。\nタイトル：「${appName}」\nキャッチコピー：「${catchCopy}」\n\nデザインの指示：\n${prompt}`;
            if (aspectRatio !== 'original') {
              textModePrompt += `\n\n【重要】出力画像のアスペクト比（縦横比）は必ず「${aspectRatio}」になるように構図を調整してください。`;
            }

            // Cloudflare Workerへ送信 (Text to Image)
            const url = `${WORKER_URL}/api/generate-text-to-image`;
            const payload = {
              instances: { prompt: textModePrompt },
              parameters: { sampleCount: 1 }
            };

            response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            
            if (!response.ok) {
              const errData = await response.json();
              throw new Error(errData.error || '通信エラー');
            }

            const result = await response.json();
            const outputBase64 = result.predictions?.[0]?.bytesBase64Encoded;

            if (outputBase64) {
              setResultImage(`data:image/png;base64,${outputBase64}`);
            } else {
              setError('AIが画像を生成できませんでした。');
            }
          }

        } catch (err) {
          console.error(err);
          setError(`エラーが発生しました: ${err.message} (Workerの設定URLが正しいか、CORS設定ができているか確認してください)`);
        } finally {
          setIsGenerating(false);
        }
      };

      const handleDownload = () => {
        if (resultImage) {
          const a = document.createElement('a');
          a.href = resultImage;
          a.download = `magic-thumbnail-${Date.now()}.jpg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      };

      const isReadyToGenerate = () => {
        if (mode === 'image') return !!sourceImage;
        if (mode === 'text') return appName || catchCopy;
        return false;
      };

      return (
        <div>
          <header className="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
            <div className="flex items-center gap-2 text-indigo-600">
              <IconWand />
              <h1 className="text-xl font-bold tracking-tight">Thumbnail Magic</h1>
            </div>
            <div className="text-sm text-gray-500 hidden sm:block">AI思い出スタイリスト</div>
          </header>

          <main className="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
              
              <div className="space-y-6">
                <div className="flex bg-gray-200 p-1 rounded-xl">
                  <button
                    onClick={() => setMode('image')}
                    className={`flex-1 flex items-center justify-center gap-2 py-3 text-sm font-bold rounded-lg transition-all ${mode === 'image' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                  >
                    <IconImage />
                    写真から変換
                  </button>
                  <button
                    onClick={() => setMode('text')}
                    className={`flex-1 flex items-center justify-center gap-2 py-3 text-sm font-bold rounded-lg transition-all ${mode === 'text' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                  >
                    <IconType />
                    テキストから生成
                  </button>
                </div>

                {mode === 'image' ? (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                      <span className="text-indigo-500"><IconImage /></span>
                      1. 写真を選ぶ
                    </h2>
                    
                    {!sourceImage ? (
                      <div 
                        className="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:bg-gray-50 hover:border-indigo-400 transition-colors cursor-pointer"
                        onClick={() => fileInputRef.current?.click()}
                      >
                        <div className="flex justify-center text-gray-400 mb-3"><IconUpload /></div>
                        <p className="text-sm font-medium text-gray-700">クリックしてアップロード</p>
                        <p className="text-xs text-gray-500 mt-1">※自動でAI最適なサイズに圧縮されます</p>
                      </div>
                    ) : (
                      <div className="relative rounded-xl overflow-hidden group">
                        <img src={sourceImage} alt="Source" className="w-full h-48 object-cover" />
                        <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                          <button 
                            onClick={() => { setSourceImage(null); setResultImage(null); }}
                            className="bg-white text-gray-800 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors"
                          >
                            別の写真を選ぶ
                          </button>
                        </div>
                      </div>
                    )}
                    <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/jpeg, image/png, image/webp" className="hidden" />
                  </div>
                ) : (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                      <span className="text-indigo-500"><IconType /></span>
                      1. テキスト情報を入力する
                    </h2>
                    <div className="space-y-4">
                      <div>
                        <label className="text-sm font-medium text-gray-700 block mb-1">アプリ名（タイトル）</label>
                        <input type="text" value={appName} onChange={(e) => setAppName(e.target.value)} placeholder="例: Thumbnail Magic" className="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                      </div>
                      <div>
                        <label className="text-sm font-medium text-gray-700 block mb-1">キャッチコピー</label>
                        <input type="text" value={catchCopy} onChange={(e) => setCatchCopy(e.target.value)} placeholder="例: AIが思い出を特別な一枚に" className="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                      </div>
                    </div>
                  </div>
                )}

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                    <span className="text-indigo-500"><IconSparkles /></span>
                    2. スタイルを選ぶ
                  </h2>
                  <div className="grid grid-cols-2 gap-2 mb-4 h-64 overflow-y-auto pr-2 custom-scrollbar">
                    {presets.map(p => (
                      <button
                        key={p.id}
                        onClick={() => handlePresetClick(p)}
                        className={`text-left p-3 rounded-xl border text-sm transition-all duration-200 flex flex-col justify-center min-h-[60px] ${prompt === p.prompt ? 'border-indigo-500 bg-indigo-50 ring-1 ring-indigo-500 shadow-sm' : 'border-gray-200 hover:border-indigo-300 hover:bg-gray-50'}`}
                      >
                        <div className="font-medium text-gray-800 leading-tight">{p.icon} {p.title}</div>
                      </button>
                    ))}
                  </div>

                  <div className="space-y-2">
                    <label className="text-sm font-medium text-gray-700 block">AIへの指示（自由に編集できます）</label>
                    <textarea
                      value={prompt}
                      onChange={(e) => setPrompt(e.target.value)}
                      placeholder="ボタンを押すか、作りたいイメージを入力してください..."
                      className="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none resize-none h-24 text-sm"
                    />
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                    <div className="w-5 h-5 flex items-center justify-center text-indigo-500"><div className="w-4 h-4 border-2 border-current rounded-sm"></div></div>
                    3. 画像の形（縦横比）を選ぶ
                  </h2>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    {ratios.map(r => (
                      <button
                        key={r.id}
                        onClick={() => setAspectRatio(r.id)}
                        className={`p-3 rounded-xl border text-sm font-medium transition-all flex flex-col items-center justify-center gap-2 ${aspectRatio === r.id ? 'border-indigo-500 bg-indigo-50 text-indigo-700 ring-1 ring-indigo-500 shadow-sm' : 'border-gray-200 text-gray-600 hover:border-indigo-300 hover:bg-gray-50'}`}
                      >
                        <div className="h-6 flex items-center justify-center text-current opacity-70">
                          {r.id === 'original' && <IconImage />}
                          {r.id === '1:1' && <div className="w-5 h-5 border-2 border-current rounded-sm"></div>}
                          {r.id === '16:9' && <div className="w-6 h-3.5 border-2 border-current rounded-sm"></div>}
                          {r.id === '9:16' && <div className="w-3.5 h-6 border-2 border-current rounded-sm"></div>}
                        </div>
                        {r.label}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={generateImage}
                  disabled={isGenerating || !isReadyToGenerate()}
                  className={`w-full py-4 rounded-xl font-bold text-white shadow-md flex items-center justify-center gap-2 transition-all ${isGenerating || !isReadyToGenerate() ? 'bg-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 hover:shadow-lg active:scale-[0.98]'}`}
                >
                  {isGenerating ? (
                    <><IconRefresh />魔法をかけています...</>
                  ) : (
                    <><IconWand />この設定で生成する</>
                  )}
                </button>
                
                {error && (
                  <div className="p-4 bg-red-50 text-red-700 rounded-xl text-sm border border-red-100 font-bold">
                    {error}
                  </div>
                )}
              </div>

              <div className="bg-gray-100 p-6 rounded-3xl flex flex-col items-center justify-center min-h-[500px] border-2 border-dashed border-gray-200 relative overflow-hidden sticky top-24 h-[calc(100vh-120px)]">
                {isGenerating ? (
                  <div className="flex flex-col items-center text-indigo-500 z-10">
                    <div className="relative w-20 h-20 mb-4">
                      <div className="absolute inset-0 border-4 border-indigo-200 rounded-full"></div>
                      <div className="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
                      <span className="absolute inset-0 m-auto w-8 h-8 flex items-center justify-center animate-pulse"><IconSparkles /></span>
                    </div>
                    <p className="font-medium animate-pulse">
                      {mode === 'image' ? 'AIがピクセルを描き出しています...' : 'AIがデザインを考えています...'}
                    </p>
                  </div>
                ) : resultImage ? (
                  <div className="w-full h-full flex flex-col items-center justify-center z-10 space-y-6">
                    <img 
                      src={resultImage} 
                      alt="Generated Result" 
                      className="max-w-full max-h-full rounded-2xl shadow-2xl object-contain bg-white"
                    />
                    <button
                      onClick={handleDownload}
                      className="flex items-center gap-2 bg-white text-gray-800 px-6 py-3 rounded-full font-medium shadow-sm hover:shadow-md hover:bg-gray-50 transition-all border border-gray-200 absolute bottom-8"
                    >
                      <IconDownload />
                      画像を保存する
                    </button>
                  </div>
                ) : (
                  <div className="text-center text-gray-400 z-10">
                    <div className="flex justify-center opacity-50 mb-4"><IconImage /></div>
                    <p>ここに完成した画像が表示されます</p>
                  </div>
                )}
                
                <div className="absolute -top-24 -right-24 w-64 h-64 bg-purple-200 rounded-full mix-blend-multiply opacity-30 animate-blob"></div>
                <div className="absolute -bottom-24 -left-24 w-64 h-64 bg-indigo-200 rounded-full mix-blend-multiply opacity-30 animate-blob animation-delay-2000"></div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
